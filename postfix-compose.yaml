
services:

  ## POSTFIX
  ## =================

  dns:
    image: crazymax/unbound:latest
    container_name: dns
    user: "0:0"
    cap_add:
      - NET_BIND_SERVICE
    networks:
      internal:
        ipv4_address: 10.0.0.53
    volumes:
      - ./unbound/conf.d/:/config/:ro
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        unbound-anchor -a /var/run/unbound/root.key || true
        exec su -s /bin/sh unbound -c "sh /entrypoint.sh"

  postfix:
    image: private/postfix:latest
    build:
      context: ./postfix/
      dockerfile: Dockerfile
    container_name: postfix
    dns:
      - '10.0.0.53'
    networks:
      - internal
    env_file: .env
    ports:
      - '25:25'
    volumes:
      - certs:/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -w 3 127.0.0.1 25 </dev/null | grep -q '^220'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      dns:
        condition: service_healthy
      postgres:
        condition: service_healthy
      traefik-certificate-exporter:
        condition: service_healthy
      opendkim:
        condition: service_healthy
    labels:
      - com.github.ravensorb.traefik-certificate-exporter.domain-restart=${SUBDOMAIN:-app}.${DOMAIN},${DOMAIN}

  traefik-certificate-exporter:
    image: ravensorb/traefik-certificate-exporter:latest
    container_name: cert-exporter
    environment:
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_FLAT=true
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_RESTARTCONTAINER=true
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_RUNATSTART=true
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_RESOLVERINPATHNAME=false
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_DOMAINS_INCLUDE=${DOMAIN},${SUBDOMAIN:-app}.${DOMAIN},*.${DOMAIN}
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_DOMAINS_EXCLUDE=exclude # see: https://github.com/ravensorb/traefik-certificate-exporter/issues/5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/data:ro
      - certs:/certs:rw
    healthcheck:
      test: ["CMD-SHELL", "[ -f \"/certs/${SUBDOMAIN:-app}.${DOMAIN}.fullchain.pem\" ] || [ -f \"/certs/${DOMAIN}.fullchain.pem\" ]"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5m
    depends_on:
      - app

  ## DKIM signing for postfix-internal/outgoing mail (e.g. MAILER-DAEMON bounces)
  ## =======================================================================
  ## This is a standalone OpenDKIM milter. Postfix is configured (see postfix/templates)
  ## to use it for both SMTP and non-SMTP originated messages.
  opendkim:
    image: instrumentisto/opendkim:2.11-alpine
    container_name: opendkim
    networks:
      - internal
    expose:
      - "8891"
    environment:
      - DOMAIN=${DOMAIN}
      - DKIM_SELECTOR=${DKIM_SELECTOR:-default}
    volumes:
      # Reuse the same private key you already mount into SimpleLogin.
      # (Long-term, this could also be replaced by Docker secrets.)
      - ./dkim.key:/dkim.key:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "${DOMAIN:?Need DOMAIN}"
        SELECTOR="${DKIM_SELECTOR:-default}"

        cat > /etc/opendkim/opendkim.conf <<'EOF'
        Syslog                  yes
        SyslogSuccess           yes
        LogWhy                  yes

        UMask                   002

        # Listen as a TCP milter inside the docker network
        Socket                  inet:8891@0.0.0.0

        # Sign outgoing mail
        Mode                    sv

        Canonicalization        relaxed/simple
        OversignHeaders         From

        AutoRestart             yes
        AutoRestartRate         10/1h
        Background              no

        SubDomains              yes

        # Only Postfix inside this compose network should be trusted to ask for signing
        InternalHosts           /etc/opendkim/TrustedHosts

        KeyTable                /etc/opendkim/KeyTable
        SigningTable            refile:/etc/opendkim/SigningTable

        # Recommended in container setups where keys are mounted as volumes
        RequireSafeKeys         false
        EOF

        cat > /etc/opendkim/TrustedHosts <<'EOF'
        postfix
        EOF

        # KeyTable: <key-name> <domain>:<selector>:<private-key-path>
        cat > /etc/opendkim/KeyTable <<EOF
        ${SELECTOR}._domainkey.${DOMAIN} ${DOMAIN}:${SELECTOR}:/dkim.key
        EOF

        # SigningTable: <pattern> <key-name>
        cat > /etc/opendkim/SigningTable <<EOF
        *@${DOMAIN} ${SELECTOR}._domainkey.${DOMAIN}
        EOF

        exec /init
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8891"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  certs:
  ## Uncomment the next lines, if traefik is running outside this project
  # traefik-acme:  # <-- do not change this identifier
  #   name: traefik-acme    # change (only) this to the name of traefik acme storage volume
  #   external: true
